name: Track live rates

# Reads the fleet dashboard every 30 minutes and keeps the counts behind the page's Live rates
# (evals passed and failed, funded trades and flip days won and lost) on the "track" branch.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/track.js
      - .github/workflows/track.yml

permissions:
  contents: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: track
          path: counts
      - name: Count
        run: node tools/track.js counts
      - name: Save
        working-directory: counts
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "Counts $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push -q
          fi
