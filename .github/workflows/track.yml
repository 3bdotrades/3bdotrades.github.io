name: Count live rates

# Every 10 minutes, just after the dashboard's own build: reads the builds of the fleet dashboard it has not read yet (each
# one is a commit in the dashboard's public repository) and keeps the counts behind the page's four Live rates on the
# "track" branch. See tools/track.js.
on:
  schedule:
    - cron: '9-59/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/track.js
      - .github/workflows/track.yml

permissions:
  contents: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: track
          path: counts
      - name: Dashboard history
        run: git clone --quiet --no-checkout https://github.com/randompotato247/fleet-dashboard.git dash
      - name: Count
        run: node tools/track.js counts dash
      - name: Save
        working-directory: counts
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "Counts $(date -u +'%Y-%m-%d %H:%M') UTC"
            # The counter also runs as a scheduled task on the owner's PC. When that one saved the same builds a moment
            # earlier, the push is refused: its counts stand and this run is done. Any other refusal is an error.
            if ! git push -q; then
              git fetch -q origin track
              if [ "$(git rev-parse FETCH_HEAD)" != "$(git rev-parse HEAD~1)" ]; then echo "Saved by another run first."; else exit 1; fi
            fi
          fi
