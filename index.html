<style>
/* One strip of numbers, one table, one chart. Same look as the fleet dashboard this page reads. */
:root{
  color-scheme:dark;
  --bg:#0f1216; --card:#171b21; --row:#1c2128; --ink:#e6e9ed; --mute:#8b949e; --line:#262c35;
  --accent:#6c9cf0; --pos:#4cc27f; --neg:#ef6b5e;
  --in:#199e70; --out:#d95926; --net:#3987e5;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,"Segoe UI",sans-serif}
main{max-width:1180px;margin:0 auto;padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
a:focus-visible,button:focus-visible,input:focus-visible,.chartbox:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mute{color:var(--mute)}
.num{font-variant-numeric:tabular-nums}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{padding:8px 16px;border-bottom:2px solid transparent;color:var(--mute);text-decoration:none}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-color:var(--accent);font-weight:600}
.note{color:var(--mute);font-size:13px;margin:0 0 4px}
.note button{font:inherit;color:var(--accent);background:none;border:0;padding:0;margin-left:6px;cursor:pointer}
.note button:hover{text-decoration:underline}
h2{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:space-between;align-items:baseline;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:22px 0 8px;font-weight:600}
.wrap{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow-x:auto}

/* the strip: four results, four live rates */
.top{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:0 14px}
.top>div{display:flex;flex-direction:column;min-width:0}
.top .wrap{flex:1}
.cells{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.cell{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:10px 12px;min-width:0}
.cell+.cell{border-left:1px solid var(--line)}
.cell .k,.cell label{font-size:12px;font-weight:600;color:var(--mute)}
.cell .v{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:6px;font-size:20px;font-weight:600;line-height:1.3;font-variant-numeric:tabular-nums}
.cell .v small{font-size:13px;font-weight:400;color:var(--mute)}
.rates .v{column-gap:3px}
.box{width:3.6em;font:600 20px/1.3 system-ui,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0 6px;text-align:right;-moz-appearance:textfield;appearance:textfield}
.box::-webkit-outer-spin-button,.box::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.box:hover{border-color:var(--mute)}
td .box{width:4em;font-size:14px;line-height:1.5}
td .box.s{width:2.8em;text-align:center}
tbody tr+tr td.same{border-top-color:transparent}
.box:disabled{opacity:.4}
.seg{display:inline-flex;gap:12px;text-transform:none;letter-spacing:0}
.seg button{font:600 13px/1.2 system-ui,"Segoe UI",sans-serif;color:var(--mute);background:none;border:0;padding:0;cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{color:var(--ink);text-decoration:underline 2px var(--accent);text-underline-offset:5px}

/* per firm */
table{width:100%;border-collapse:collapse}
th,td{padding:8px 12px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;position:sticky;left:0}
thead th{font-size:12px;color:var(--mute);font-weight:600;border-bottom:1px solid var(--line);background:var(--row)}
tbody td:first-child{background:var(--card)}
tbody tr+tr td{border-top:1px solid var(--line)}
tbody tr:hover td{background:var(--row)}
td.who{padding:0}
.pick{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer}
.pick input{flex:none;width:15px;height:15px;margin:0;accent-color:var(--accent);cursor:pointer}
tr.off .pick{color:var(--mute)}
.note.after{margin:8px 2px 0}

/* cash by week */
.legend{display:inline-flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;font-weight:400;text-transform:none;letter-spacing:0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.legend i.line{width:14px;height:2px;border-radius:1px;vertical-align:3px}

.chartcard{padding:12px 12px 6px}
.chartbox{position:relative;min-width:0}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.chartbox text{font-size:11.5px;fill:var(--mute);font-variant-numeric:tabular-nums}
.tip{position:absolute;pointer-events:none;background:var(--row);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.35);min-width:190px;z-index:2}
.tip .h{font-weight:600;margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:16px}
.tip .r span:first-child{color:var(--mute)}
.tip i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}

@media (max-width:1040px){
  .top{grid-template-columns:minmax(0,1fr)}
}

  .cells{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cells .cell:nth-child(3){border-left:0}
  .cells .cell:nth-child(n+3){border-top:1px solid var(--line)}
}

<script>
(function(){
'use strict';
// ---------- MODEL START ----------
function num(v, d){ v = Number(v); return isFinite(v) ? v : d; }
function clamp01(v){ v = Number(v); return isFinite(v) ? Math.min(1, Math.max(0, v)) : 0; }
function fundedToProfit(win, tries){ return 1 - Math.pow(1 - clamp01(win), Math.min(10, Math.max(1, Math.round(num(tries, 1))))); }
function params(r){
  var D = Math.min(30, Math.max(1, Math.round(num(r.payDays, 5))));
  return { pass: clamp01(r.pass), win: clamp01(r.win), tries: Math.min(10, Math.max(1, Math.round(num(r.tries, 2)))), q: clamp01(r.flip),
    D: D, D1: Math.min(30, Math.max(1, Math.round(num(r.payDays1, D)))), L: Math.min(60, Math.max(1, Math.round(num(r.lossDays, 20)))),
    wd0: Math.max(0, Math.min(5, Math.round(num(r.wd0, 0)))), chance: !!r.chance, odds: r.odds > 0 && r.odds < 1 ? Number(r.odds) : FUNDED_ODDS };
}
// ----- the eval stage -----
// An eval trades one day at a time. A winning day is worth just over half of its target, because no day may be more than 50%
// of the profit: two winning days pass it ($1,508 a day on a $3,000 target). At Tradeify the rule is 40%, so a winning day is
// just under 40% of the target ($1,198) and it takes three. A losing day costs about a third of the target (stops of $988 to
// $1,142 on $3,000), half of the drawdown: two losing days in a row end the eval. It has passed once its profit reaches the
// target. So an eval lasts at least 2 days (Tradeify 3), and longer when losing days come in between.
var EVAL_WIN = 1508 / 3000, EVAL_WIN_AT = { tradeify: 1198 / 3000 }, EVAL_LOSS = 0.345, EVAL_MAX = 16;
function ownOf(o, k){ return Object.prototype.hasOwnProperty.call(o, k) ? o[k] : undefined; }      // o[k], never something every object has
function evalWin(firm){ return ownOf(EVAL_WIN_AT, normFirm(firm)) || EVAL_WIN; }
// Chance: with no edge a trade wins stop / (stop + target) of the time, counted on the price moves themselves (fees change
// what a day books, not how often it wins). What the fleets' trades risk and aim for, from what they book on the dashboards:
// an eval day risks $1,000 (EVAL_STOP; stops book $988 to $1,142 with fees and slippage) for $1,520, which books $1,508
// after about $12 of fees (EVAL_FEE; Topstep, with lower fees, books $1,512): 39.7% a day. At Tradeify the target is $1,210
// for its $1,198: 45.2% a day. A 25K eval is the same trade at half size.
var EVAL_STOP = 1000 / 3000, EVAL_FEE = 12 / 3000;
function evalOdds(firm){ return EVAL_STOP / (EVAL_STOP + evalWin(firm) + EVAL_FEE); }
// The days an eval still has to go from a known point: `at` = its profit so far as a share of its target, `hurt` = it is
// down to one losing day (the next one ends it). With a win rate of p a day: pass[j] = the chance it passes on its j-th day
// from now, out[j] = the chance it is finished that day, passed or not; rate = the chance it passes at all; days = how long
// it lasts on average. An eval still going after EVAL_MAX days is counted as finished without a pass on that day.
function evalRoad(win, p, at, hurt){
  var pass = new Float64Array(EVAL_MAX + 1), out = new Float64Array(EVAL_MAX + 1), cur = {}, q = 1 - p, rate = 0, days = 0, j, k;
  function put(set, u, h, m){ if (!(m > 0)) return; var key = Math.round(u * 1e6) + (h ? 'h' : ''); if (set[key]) set[key][2] += m; else set[key] = [u, h, m]; }
  put(cur, at, !!hurt, 1);
  for (j = 1; j <= EVAL_MAX; j++){
    var nx = {}, keys = Object.keys(cur);
    for (k = 0; k < keys.length; k++){
      var s = cur[keys[k]], m = s[2];
      if (s[0] + win >= 1 - 1e-9){ pass[j] += m * p; out[j] += m * p; } else put(nx, s[0] + win, false, m * p);
      if (s[1]) out[j] += m * q; else put(nx, s[0] - EVAL_LOSS, true, m * q);
    }
    cur = nx;
  }
  Object.keys(cur).forEach(function(key){ out[EVAL_MAX] += cur[key][2]; });
  for (j = 1; j <= EVAL_MAX; j++){ rate += pass[j]; days += j * out[j]; }
  return { pass: pass, out: out, rate: rate, days: days };
}
// an eval the dashboard still lists with no room left: finished, with no pass, on its first day
var EVAL_GONE = (function(){ var o = { pass: new Float64Array(EVAL_MAX + 1), out: new Float64Array(EVAL_MAX + 1), rate: 0, days: 1 }; o.out[1] = 1; return o; })();
// The win rate per day behind an eval pass rate: the one at which a new eval that needs two winning days passes that often.
var EVAL_P = {};
function evalP(pass){
  var want = clamp01(pass), key = String(want), lo = 0, hi = 1, i, mid;
  if (EVAL_P[key] === undefined){
    for (i = 0; i < 60; i++){ mid = (lo + hi) / 2; if (evalRoad(EVAL_WIN, mid, 0, false).rate < want) lo = mid; else hi = mid; }
    EVAL_P[key] = (lo + hi) / 2;
  }
  return EVAL_P[key];
}
// The eval numbers of one firm: what a winning day is worth, its win rate per day and the road of a new eval (fresh.rate =
// how often it passes). The fleet's eval pass rate gives the win rate per day of an eval that needs two winning days (evalP).
// A firm whose winning day is smaller has a closer target and wins its day more often, by as much as chance says: Tradeify's
// days win 45.2 / 39.7 times as often, and it still passes less often because it needs three of them.
// On chance alone (P.chance) the win rate per day is the firm's odds themselves.
function evalOf(f, P){
  var win = evalWin(f.firm), odds = evalOdds(f.firm), p = P.chance ? odds : Math.min(1, evalP(P.pass) * odds / evalOdds(''));
  return { win: win, p: p, fresh: evalRoad(win, p, 0, false) };
}
// ----- the flip stage -----
// A flip account trades one day at a time. A losing day takes `loss` dollars of its room (the distance to the firm's floor),
// a winning day adds `win`. The fleet's flip is 5 MNQ with a 15-point stop: $150 plus about $7.50 of fees lost; its target is
// 16 points on a 50K ($160 less fees) and 10.75 points on a 25K. Aqua's days are bigger: its two numbers are what its
// accounts showed on the dashboards (losses of $212, $210 and $224, wins of $203).
var DAY_LOSS = 157.5, DAY_LOSS_AT = { 'aqua|50': 215 }, DAY_WIN = 152.5, DAY_WIN_25 = 100, DAY_WIN_AT = { 'aqua|50': 203 };
var FIRM_ALIAS = { bg: 'blueguardian' }, FIRM_KEYS = ['lucid', 'topstep', 'aqua', 'blueguardian', 'futureselite', 'tradeify'];
function dayLoss(firm, size){ return DAY_LOSS_AT[normFirm(firm) + '|' + sizeNum(size)] || DAY_LOSS; }
function dayWin(firm, size){ return DAY_WIN_AT[normFirm(firm) + '|' + sizeNum(size)] || (sizeNum(size) === 25 ? DAY_WIN_25 : DAY_WIN); }
// Chance (see evalOdds): a flip day risks its stop for its target, each without the fees (FLIP_FEE): $150 for $160 on a 50K,
// 48.4%; $150 for $107.50 on a 25K, 58.3%. G1's funded trade risks $1,000 for $4,000 (it books $3,988; $500 for $2,000 on a
// 25K): 20% a trade. A new funded account has $2,000 of room (FUNDED_ROOM), $1,000 on a 25K.
var FLIP_FEE = 7.5, FUNDED_STOP = 1000, FUNDED_TARGET = 4000, FUNDED_ODDS = FUNDED_STOP / (FUNDED_STOP + FUNDED_TARGET), FUNDED_ROOM = 2000, FUNDED_ROOM_25 = 1000;
function flipOdds(firm, size){ var stop = dayLoss(firm, size) - FLIP_FEE; return stop / (stop + dayWin(firm, size) + FLIP_FEE); }
// V2's funded trade risks the same $1,000 for $5,000 (its wins book $4,988 and $4,992; $2,500 on a 25K): 1 in 6 on chance.
// A fleet's funded odds are what its coin-flip line gives a funded trade, and the odds its live funded win was earned at
// (see tryWin).
var FUNDED_TARGET_AT = { v2: 5000 };
function fundedOdds(fleet){ return FUNDED_STOP / (FUNDED_STOP + (ownOf(FUNDED_TARGET_AT, fleet) || FUNDED_TARGET)); }
// A payout is a request taken out of the room. The trader's share of a request is 90% (SPLIT). On its way to the bank that
// share loses 1% in fees (PAY_FEE); at Topstep it loses a fixed $30 a payout instead, whatever its size (PAY_FIXED). The
// owner's numbers of 11 Nov 2026 (3.5% at every firm before that). A $2,000 request is a payout of $1,800 and books $1,782,
// at Topstep $1,770. A payout that is smaller than its fixed fee books nothing.
// A payout is accepted once its winning days are in and the account has any room at all, even $1 (the owner, 11 Nov 2026):
// it takes the size's usual request, or all the room there is when that is less, and the account is then at zero and done.
// (TIE: two amounts closer than this count as equal.)
var SPLIT = 0.9, PAY_FEE = 0.01, PAY_FIXED = { topstep: 30 }, TIE = 1e-6;
// After its second payout (the owner and Tondy, 11 Nov 2026):
// - with $1,000 of room or more left (KEEP_ROOM; half of that on a 25K) the account flips on, and its next winning days bring
//   a third payout that takes half of its room: about $1,000 of room is a $500 request and pays $450;
// - after that third payout, or straight after the second when less is left, it is used again for one funded trade. On V2's
//   dashboard that trade is half the size of a first one: it risks $500 (RE_RISK; a lost one books about -$511, RE_LOSS) for
//   $2,000 on a 50K, where a win adds $1,996 of room (RE_WIN), and for $1,500 on a 25K, where it adds $1,508. If it wins, the
//   account starts over: 5 winning days to a payout of its first size, then the second, and so on. If it loses, it is done.
// A run follows an account through RE_ROUNDS such wins; what could come after them is under $4 an account at the fleets' rates.
var KEEP_ROOM = 1000, KEEP_ROOM_25 = 500, RE_RISK = 500, RE_LOSS = 511, RE_TARGET = 2000, RE_TARGET_25 = 1500, RE_WIN = 1996, RE_WIN_25 = 1508, RE_ROUNDS = 3;
// Tradeify pays a payout after the first only when the flips since the last payout are at least $1 up (NET_MIN). An account
// with its winning days in and less than that gets no payout yet: it takes funded trades for what is missing, each risking the
// same $500 (a lost one is missing too), until one wins and the payout is due or its room is gone. A run follows this rule until
// the account's first win of a trade it was used again for (what the rule would still change after that is under $12 an
// account at the fleets' rates).
var NET_FIRMS = { tradeify: true }, NET_MIN = 1;
// the most room an account is followed with: twice what the biggest one starts with (a dashboard row that shows more is read
// as this much, so that no row can make the page slow)
var ROOM_MAX = 10000;
// The flip numbers of one size: its flip win (its own when set, else the rates bar), what a day wins and loses, its room at
// the start, its two requests (req1, req2: the payouts pay1 and pay2 are the trader's share of them), the winning days a payout
// takes (D1 the first, D the later ones), what a payout loses in fees (cut: the share of it, or fee: the fixed amount where
// the firm has one), and what it does after the second payout (keep, again, re: the chance its one funded trade wins).
function flipOf(f, P){
  var fq = num(f.flip, 0), s = dayLoss(f.firm, f.size), small = sizeNum(f.size) === 25, fixed = Math.max(0, num(PAY_FIXED[normFirm(f.firm)], 0));
  var F = { q: fq > 0 ? clamp01(fq / 100) : P.q, s: s, g: dayWin(f.firm, f.size), room: Math.min(ROOM_MAX, num(f.room, 0) > 0 ? num(f.room, 0) : P.L * s), D1: P.D1, D: P.D,
            req1: Math.max(0, num(f.pay1, 0)) / SPLIT, req2: Math.max(0, num(f.pay2, 0)) / SPLIT, cut: fixed > 0 ? 0 : PAY_FEE, fee: fixed,
            keep: small ? KEEP_ROOM_25 : KEEP_ROOM, again: small ? RE_WIN_25 : RE_WIN,
            net: NET_FIRMS[normFirm(f.firm)] === true, win: P.win, ref: P.odds > 0 && P.odds < 1 ? P.odds : FUNDED_ODDS, chance: P.chance };
  F.re = tryWin(F, small ? RE_TARGET_25 : RE_TARGET);
  return F;
}
// The chance that a funded trade which risks RE_RISK for `target` wins. On chance alone: its odds. With a fleet's rates: the
// fleet's own funded win per trade, which it has on its usual funded trade (odds F.ref: 20% at G1, 1 in 6 at V2, see
// fundedOdds), moved by as much as these odds differ from that (on the log-odds scale, so a trade with the same odds wins
// exactly as often as the fleet's).
function tryWin(F, target){
  var odds = RE_RISK / (RE_RISK + target);
  if (F.chance) return odds;
  if (!(F.win > 0)) return 0;
  if (F.win >= 1) return 1;
  return 1 / (1 + Math.exp(-(Math.log(odds / (1 - odds)) + Math.log(F.win / (1 - F.win)) - Math.log(F.ref / (1 - F.ref)))));
}
// The life of an account in profit as a road of states, made as far as it is needed. A state is where an account stands at
// the start of a day: flipping in cycle k of its round, with rem winning days still needed and so much room; about to take the
// one funded trade it is used again for; or taking a funded trade for what its cycle is short of. For state i: p[i] = the
// chance its day is won, win[i] and loss[i] = the state after a day won or lost (-1: the account is done, or lost),
// pay[i] = what a day won books. A state is made after the states it leads to, so those always have a lower number.

  shareBusy = true; clearTimeout(shareTimer);
  shareTimer = setTimeout(function(){
    relayPart().then(function(relay){
      if (mine !== shareSeq) return;                   // edited again meanwhile: that edit sends
      var top = Math.max(relay.best ? relay.best.n : 0, state.sh ? state.sh.n : 0, keptSeen ? keptSeen.n : 0);
      state.sh = { n: top + 1, t: new Date().toISOString(), by: state.dev }; save();
      return sendPart();
    }).catch(function(){}).then(function(){ if (mine === shareSeq) shareBusy = false; });
  }, 1200);
}

// The Simulation tab's own rates, "Chance": what the trade sizes give a trader with no edge (see evalOdds and flipOdds).
// pass = how often a new eval that needs two winning days passes at those odds; win = the funded trade's odds; flip and
// flip25 = a flip day's odds on a 50K and on a 25K. A run with them takes every firm's own odds (chance: true).
// fleet: whose funded trade (see fundedOdds). The Simulation tab's Chance is G1's, the owner's own numbers.
function chanceRates(fleet){
  var odds = fundedOdds(fleet);
  return { pass: evalRoad(EVAL_WIN, evalOdds(''), 0, false).rate, win: odds, odds: odds, flip: flipOdds('', '50K'), flip25: flipOdds('', '25K'), chance: true,
    tries: FIXED.tries, payDays1: FIXED.payDays1, payDays: FIXED.payDays, lossDays: FIXED.lossDays, wd0: WD0 };
}
function onChance(){ return SIM && state.base === 'chance'; }
// The rates a run takes: the live ones, as the page shows them. Funded win becomes the chance per trade p:
// an account with FIXED.tries trades at it reaches profit with 1 - (1 - p)^tries. odds = the odds of the funded trade that
// rate was earned on.
function fracRates(){
  if (onChance()) return chanceRates(SIM ? 'g1' : FLEET.key);
  var r = liveRates(), f = {};
  RATE_KEYS.forEach(function(k){ f[k] = r[k] / 100; });
  return { pass: f.pass, win: 1 - Math.pow(1 - clamp01(f.win), 1 / FIXED.tries), odds: fundedOdds(SIM ? state.base : FLEET.key), flip: f.flip, flip25: f.flip25,
    tries: FIXED.tries, payDays1: FIXED.payDays1, payDays: FIXED.payDays, lossDays: FIXED.lossDays, wd0: WD0 };
}
// a 25K account flips the 25K box: its row takes that rate. On chance alone every row has the odds of its own flip day.
function boxed(f, rr){
  if (rr.chance) f.flip = 100 * flipOdds(f.firm, f.size);
  else if (sizeNum(f.size) === 25) f.flip = Math.max(1e-9, rr.flip25 * 100);
  return f;
}

// The plan starts on this browser's today. When the dashboard's trading day is that same day, an account that has already
// traded today takes its next trade tomorrow (see planFirms and simulateGroup). On any other day every account trades on the
// plan's first day: in the hour after midnight here the fleet's day has not rolled yet (18:00 ET), at a weekend the plan

var TODAY = new Date();

  return !!m && WD0 < 5 && +m[1] === TODAY.getDate() && MONTHS.indexOf(m[2]) === TODAY.getMonth();
}
// The share of the fleet's open evals that have traded today (of its other accounts when it has no eval): an eval bought
// now has that much of today's trade behind it.
function lateShare(){
  var n = 0, k = 0, n2 = 0, k2 = 0;
  state.firms.forEach(function(f){
    (f.g1Evals || []).forEach(function(x){ if (x && !x.gone){ n++; if (x.done) k++; } });
    (f.g1Funded || []).concat(f.g1Flips || []).forEach(function(x){ if (x){ n2++; if (x.done) k2++; } });
  });

}
function weekStart(t){ var d = new Date(START.getTime()); d.setDate(d.getDate() + 7 * t); return d; }
function dShort(d){ return d.getDate() + ' ' + MONTHS[d.getMonth()]; }

// ---------- format ----------
function money(v){ var s = Math.round(Math.abs(v)).toLocaleString('en-US'); return (v < -0.5 ? '−$' : '$') + s; }
function signed(v){ return (v > 0.5 ? '+' : '') + money(v); }
function kmoney(v){ var a = Math.abs(v), s; if (a >= 1000){ s = (a / 1000).toFixed(a % 1000 === 0 ? 0 : 1).replace(/\.0$/, '') + 'k'; } else s = String(Math.round(a)); return (v < 0 ? '−$' : '$') + s; }
function acc(v){ return (Math.round(v * 10) / 10).toFixed(1).replace(/\.0$/, ''); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

// ---------- chart ----------
var chartEl = document.getElementById('chart');
var tipEl = document.createElement('div'); tipEl.className = 'tip'; tipEl.hidden = true;
var lastRows = [], focusIdx = -1, geom = null;
function niceStep(range, n){ var raw = range / Math.max(1, n), mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag; }
function barPath(x0, x1, yb, yt, up){
  var h = Math.abs(yb - yt); if (h < 0.5) return '';
  var r = Math.min(4, h / 2, (x1 - x0) / 2);
  if (up) return 'M' + x0 + ',' + yb + 'L' + x0 + ',' + (yt + r) + 'Q' + x0 + ',' + yt + ' ' + (x0 + r) + ',' + yt + 'L' + (x1 - r) + ',' + yt + 'Q' + x1 + ',' + yt + ' ' + x1 + ',' + (yt + r) + 'L' + x1 + ',' + yb + 'Z';
  return 'M' + x0 + ',' + yb + 'L' + x0 + ',' + (yt - r) + 'Q' + x0 + ',' + yt + ' ' + (x0 + r) + ',' + yt + 'L' + (x1 - r) + ',' + yt + 'Q' + x1 + ',' + yt + ' ' + x1 + ',' + (yt - r) + 'L' + x1 + ',' + yb + 'Z';
}
function drawChart(rows){
  lastRows = rows;
  var W = Math.max(280, Math.floor(chartEl.clientWidth || 600)), narrow = W < 560;
  var H = narrow ? 220 : 250, m = { l: narrow ? 44 : 54, r: narrow ? 14 : 70, t: 14, b: 40 };
  var iw = W - m.l - m.r, ih = H - m.t - m.b, n = rows.length;
  // c0 = the first week that has a coin-flip total (-1: the chart has no such line)
  var hi = 1, lo = 0, c0 = -1;
  rows.forEach(function(r, i){
    hi = Math.max(hi, r.inn, r.cum); lo = Math.min(lo, -r.out, r.cum);
    if (r.coin !== undefined){ hi = Math.max(hi, r.coin); lo = Math.min(lo, r.coin); if (c0 < 0) c0 = i; }
  });
  var step = niceStep(hi - lo, narrow ? 4 : 5);
  var y0 = Math.floor(lo / step) * step, y1 = Math.ceil(hi / step) * step; if (y1 === y0) y1 = y0 + step;
  function y(v){ return m.t + ih - (v - y0) / (y1 - y0) * ih; }
  var band = iw / n; function x(i){ return m.l + band * (i + 0.5); }
  var bw = Math.max(5, Math.min(24, band * 0.46));
  var s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
  var past = 0; rows.forEach(function(r){ if (r.actual) past++; });
  if (past){ s += '<rect x="' + m.l + '" y="' + m.t + '" width="' + (band * past).toFixed(1) + '" height="' + ih + '" fill="var(--row)"/>' +
    '<text x="' + (m.l + 6) + '" y="' + (m.t + 12) + '" style="fill:var(--ink);font-weight:600">Actual</text>' +
    '<text x="' + (m.l + band * past + 6) + '" y="' + (m.t + 12) + '" style="fill:var(--ink);font-weight:600">Plan</text>'; }
  for (var v = y0; v <= y1 + step / 2; v += step){
    var yy = Math.round(y(v)) + 0.5;
    s += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--line)" stroke-width="1"' + (Math.abs(v) < 1e-6 ? '' : ' stroke-dasharray="2 4"') + '/>';
    s += '<text x="' + (m.l - 8) + '" y="' + (yy + 4) + '" text-anchor="end">' + kmoney(v) + '</text>';
  }
  var zy = y(0);
  var every = Math.max(1, Math.ceil(46 * n / iw));
  rows.forEach(function(r, i){
    var cx = x(i), x0 = cx - bw / 2, x1 = cx + bw / 2;
    if (r.inn > 0.5) s += '<path d="' + barPath(x0, x1, zy - 1, y(r.inn), true) + '" fill="var(--in)"/>';
    if (r.out > 0.5) s += '<path d="' + barPath(x0, x1, zy + 1, y(-r.out), false) + '" fill="var(--out)"/>';
    if (((r.t % every) + every) % every === 0){
      s += '<text x="' + cx + '" y="' + (H - m.b + 16) + '" text-anchor="middle" style="fill:var(--ink)">W' + r.t + '</text>';
      s += '<text x="' + cx + '" y="' + (H - m.b + 30) + '" text-anchor="middle">' + dShort(weekStart(r.t)) + '</text>';
    }
  });
  var last = rows[n - 1], ya = y(last.cum) + 4, yb = ya;
  // the coin-flip line: dashed, under the running total, leaving it at the last week of the history
  if (c0 >= 0){
    var dc = c0 > 0 ? 'M' + x(c0 - 1).toFixed(1) + ',' + y(rows[c0 - 1].cum).toFixed(1) : '';
    for (var k = c0; k < n; k++) dc += (dc ? 'L' : 'M') + x(k).toFixed(1) + ',' + y(rows[k].coin).toFixed(1);
    s += '<path id="coin" d="' + dc + '" fill="none" stroke="var(--mute)" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round"/>';
    s += '<circle cx="' + x(n - 1).toFixed(1) + '" cy="' + y(last.coin).toFixed(1) + '" r="4" fill="var(--mute)" stroke="var(--card)" stroke-width="2"/>';
    // the two totals at the right end, kept a line apart when the lines end close together
    yb = y(last.coin) + 4;
    if (Math.abs(ya - yb) < 14){ var mid = (ya + yb) / 2, up = last.cum >= last.coin ? -1 : 1; ya = mid + 7 * up; yb = mid - 7 * up; }
  }
  var d = rows.map(function(r, i){ return (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(r.cum).toFixed(1); }).join('');
  s += '<path d="' + d + '" fill="none" stroke="var(--net)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  rows.forEach(function(r, i){ s += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(r.cum).toFixed(1) + '" r="' + (i === n - 1 ? 5 : 3.5) + '" fill="var(--net)" stroke="var(--card)" stroke-width="2"/>'; });
  if (!narrow){
    s += '<text x="' + (x(n - 1) + 10) + '" y="' + ya + '" style="fill:var(--ink);font-weight:600">' + signed(last.cum) + '</text>';
    if (c0 >= 0) s += '<text id="coin-v" x="' + (x(n - 1) + 10) + '" y="' + yb + '">' + signed(last.coin) + '</text>';
  }
  var lg = document.getElementById('lg-coin'); if (lg) lg.hidden = c0 < 0;
  s += '<line id="xhair" x1="0" x2="0" y1="' + m.t + '" y2="' + (m.t + ih) + '" stroke="var(--mute)" stroke-width="1" visibility="hidden"/>';
  s += '</svg>';
  chartEl.innerHTML = s;
  chartEl.appendChild(tipEl);
  geom = { x: x, band: band, m: m, W: W, n: n, ih: ih };
  if (focusIdx >= 0) showTip(Math.min(focusIdx, n - 1));
}
function showTip(i){
  if (!geom || !lastRows[i]) return;
  var r = lastRows[i], cx = geom.x(i), xh = chartEl.querySelector('#xhair');
  if (xh){ xh.setAttribute('x1', cx); xh.setAttribute('x2', cx); xh.setAttribute('visibility', 'visible'); }
  tipEl.innerHTML = '<div class="h">W' + r.t + ' · from ' + dShort(weekStart(r.t)) + (r.actual ? ' · actual' : '') + '</div>' +
    '<div class="r"><span><i style="background:var(--in)"></i>Payouts in</span><span class="num">' + money(r.inn) + '</span></div>' +
    '<div class="r"><span><i style="background:var(--out)"></i>' + (r.actual ? 'Fees paid' : 'Evals out') + '</span><span class="num">' + money(r.out) + '</span></div>' +
    '<div class="r"><span><i style="background:var(--net)"></i>Running total</span><span class="num">' + signed(r.cum) + '</span></div>' +
    (r.coin !== undefined ? '<div class="r"><span><i class="dash"></i>Coin flip</span><span class="num">' + signed(r.coin) + '</span></div>' : '') +
    (r.actual ? '' : '<div class="r"><span>Evals to buy</span><span class="num">' + r.buy + '</span></div>') +
    (r.items && r.items.length ? '<div class="r"><span>' + r.items.map(function(e){ return esc(itemText(e)); }).join('<br>') + '</span></div>' : '');
  tipEl.hidden = false;
  var tw = tipEl.offsetWidth, left = cx + 14;
  if (left + tw > geom.W) left = cx - tw - 14;

function hideTip(){ tipEl.hidden = true; var xh = chartEl.querySelector('#xhair'); if (xh) xh.setAttribute('visibility', 'hidden'); }
chartEl.addEventListener('pointermove', function(e){
  if (!geom) return;
  var rect = chartEl.getBoundingClientRect(), px = e.clientX - rect.left;

chartEl.addEventListener('keydown', function(e){

chartEl.addEventListener('blur', function(){ focusIdx = -1; hideTip(); });
if (window.ResizeObserver){ var lastW = 0; new ResizeObserver(function(){ var w = chartEl.clientWidth; if (Math.abs(w - lastW) > 2 && lastRows.length){ lastW = w; drawChart(lastRows); } }).observe(chartEl); }

  ['2026-09-26','Topstep','fee',864.50], ['2026-09-29','Topstep','fee',425.00], ['2026-10-18','Lucid','fee',955.70], ['2026-10-22','Lucid','fee',928.80],

// G1's dashboard totals that the typed history above already covers; cash beyond them is new
var CASH0 = FLEET.key === 'g1' ? { inn: 1761, out: 8420 } : null;
function ymd(d){ return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
// the dashboard gives totals only, so a rise is logged on the day this browser first sees it
function logCash(c){
  if (!CASH0 || !c) return;
  var seen = state.cashSeen || CASH0, dIn = c.inn - seen.inn, dOut = c.out - seen.out;
  if (dIn > 0 || dOut > 0) (state.cashLog = state.cashLog || []).push({ d: ymd(new Date()), inn: Math.max(0, dIn), out: Math.max(0, dOut) });
  state.cashSeen = { inn: Math.max(seen.inn, c.inn), out: Math.max(seen.out, c.out) };
}
function cashNew(){
  var a = { inn: 0, out: 0, rows: [] };
  if (CASH0) (state.cashLog || []).forEach(function(c){ if (c.inn > 0){ a.inn += c.inn; a.rows.push([c.d, 'Dashboard', 'payout', c.inn]); } if (c.out > 0){ a.out += c.out; a.rows.push([c.d, 'Dashboard', 'fee', c.out]); } });
  return a;

function itemText(e){ return e.firm + (e.kind === 'payout' ? ' payout +' : ' fee −') + money(e.amt); }
// The chart's rows: the weeks of the history, then the weeks of the run on top of the cash so far. coin = the same run at
// Chance rates (see coinFlip): each week of the run also gets its running total, from the same cash so far.
function withHistory(res, coin){
  var n = res.per.length, h = [], w0 = { out: 0, inn: 0, items: [] }, minT = 0, totOut = 0, totIn = 0;
  var ev = ACTUALS.concat(cashNew().rows).map(function(a){ var p = a[0].split('-'), d = new Date(+p[0], +p[1] - 1, +p[2]); return { t: Math.floor(Math.round((d - START) / 864e5) / 7), firm: a[1], kind: a[2], amt: a[3] }; })
    .filter(function(e){ return e.t <= 0; });
  ev.forEach(function(e){ if (e.t < minT) minT = e.t; });
  for (var t = minT; t < 0; t++){ var z = []; for (var k = 0; k < n; k++) z.push(0); h.push({ t: t, actual: true, items: [], out: 0, inn: 0, buy: 0, buys: z }); }
  ev.forEach(function(e){ var row = e.t < 0 ? h[e.t - minT] : w0; if (e.kind === 'payout'){ row.inn += e.amt; totIn += e.amt; } else { row.out += e.amt; totOut += e.amt; } row.items.push(e); });
  var cum = 0; h.forEach(function(r){ cum += r.inn - r.out; r.cum = cum; });
  var base = cum + w0.inn - w0.out;
  // a fleet with no typed history starts from the cash totals on its dashboard
  var dc = !ACTUALS.length && state.g1 && state.g1.cash;
  if (dc){ base = dc.inn - dc.out; totOut = dc.out; totIn = dc.inn; }
  var proj = res.rows.map(function(r, i){ var o = {}; for (var key in r) o[key] = r[key]; if (i === 0){ o.out += w0.out; o.inn += w0.inn; o.items = w0.items; } o.cum = r.cum + base; if (coin && coin.rows[i]) o.coin = coin.rows[i].cum + base; return o; });
  return { rows: h.concat(proj), past: h.length, base: base, totOut: totOut, totIn: totIn, first: minT, dash: !!dc };
}

// ---------- the page: four totals, the firm table, the chart ----------
var firmsEl = document.getElementById('firms'), skipEl = document.getElementById('skip');
var RATE_WORDS = { pass: 'finished evals passed', win: 'funded accounts reached profit', flip: 'flip days won on 50K accounts', flip25: 'flip days won on 25K accounts' };
// The four rates. Hovering one shows what is behind it: the fleet's count, or on Chance the trade sizes behind the odds.
// Eval pass also says what it comes to at Tradeify, where an eval needs three winning days.

    var stop = DAY_LOSS - FLIP_FEE, shown = { pass: rr.pass, win: fundedToProfit(rr.win, rr.tries), flip: rr.flip, flip25: rr.flip25 };
    var text = {
      pass: 'an eval day risks ' + usd(3000 * EVAL_STOP) + ' for ' + usd(3000 * (EVAL_WIN + EVAL_FEE)) + ' and wins ' + pc(evalOdds('')) + ' of the time; two winning days before two losing days in a row = ' + pc(rr.pass) +
            '. At Tradeify (' + usd(3000 * EVAL_STOP) + ' for ' + usd(3000 * (EVAL_WIN_AT.tradeify + EVAL_FEE)) + ', ' + pc(evalOdds('Tradeify')) + ' a day, 3 winning days): ' + three,
      win: 'a funded trade risks ' + usd(FUNDED_STOP) + ' for ' + usd(FUNDED_STOP * (1 / rr.win - 1)) + ' and wins ' + pc(rr.win) + ' of the time; an account has ' + rr.tries + ' tries = ' + pc(shown.win),
      flip: 'a flip day on a 50K risks ' + usd(stop) + ' for ' + usd(DAY_WIN + FLIP_FEE) + ' and wins ' + pc(rr.flip) + ' of the time',

    };
    RATE_KEYS.forEach(function(k){

    });

}
// the most evals the fleet keeps trading: the highest number of eval signals it had in a day (from the dashboard)
function seats(){ if (SIM) return state.sig[state.base] > 0 ? state.sig[state.base] : undefined; var g = state.g1; return g && g.sig && g.sig.max > 0 ? g.sig.max : undefined; }
// the fleet's firms as a run at these rates takes them; all = with no firm skipped
function planFirms(rr, all){
  var on = dayOn(), late = on ? lateShare() : 0;
  return state.firms.map(function(f){ var x = slotted(boxed(clone(f), rr)); x.idle = idleOf(f); x.dayOn = on; x.lateShare = late; if (!all && skipped(f)) x.skip = true; return x; });
}
// 12 weeks from today, plus the average month once the first wave is through (per size and in total); all = with no firm skipped
function outcome(rr, all){
  var firms = planFirms(rr, all), cap = seats(), res = runAll(firms, rr, WEEKS, cap);
  res.runs = monthlyUnits(firms, rr, cap); res.run = res.runs.reduce(function(a, b){ return a + b; }, 0);
  res.buy = 0; res.cost = 0; res.per.forEach(function(p){ if (p.days[0]){ res.buy += p.days[0].buy; res.cost += p.days[0].evalCost; } });

    u.flips.push({ rem: m ? +m[2] - +m[1] : null, cycle: m && +m[2] > 4 ? 2 : 1, room: room !== null && room > 0 ? room : null, net: moneyNum(c[3]), done: traded(c) });
  });
  // eval signals: the "Avg signals" row of the summary table that has an Evals column
  var sig = null;
  Array.prototype.forEach.call(sec.querySelectorAll('table.sum'), function(sum){
    var heads = Array.prototype.map.call(sum.querySelectorAll('thead th'), function(th){ return th.textContent.trim().toLowerCase(); }), ei = heads.indexOf('evals');
    Array.prototype.forEach.call(sum.querySelectorAll('tbody tr'), function(tr){
      var c = cells(tr); if (ei > 0 && /^avg signals/i.test(c[0] || '')){ var m = /([\d.]+)[^\d]*max\s*(\d+)/i.exec(c[ei] || ''); if (m) sig = { avg: +m[1], max: +m[2] }; }
    });
  });
  // cash totals of this fleet: the two-cell "Received" and "Spent" rows.
  // Its Lifetime table: the two-cell rows "Evals", "Funded first win", "Flip days 50K" and "Flip days 25K", kept as [won, finished]
  // (running and retired accounts are in neither number)
  var cashIn = null, cashOut = null, life = {}, WL = /([\d,]+) won\D+?([\d,]+) lost/i;
  var LIFE = [[/^evals$/i, 'pass', /([\d,]+) passed\D+?([\d,]+) blown/i], [/^funded first win$/i, 'win', WL], [/^flip days 50k$/i, 'flip', WL], [/^flip days 25k$/i, 'flip25', WL]];
  Array.prototype.forEach.call(sec.querySelectorAll('tr'), function(tr){
    var c = cells(tr); if (c.length !== 2) return;
    if (/^received$/i.test(c[0])) cashIn = moneyNum(c[1]);
    else if (/^spent$/i.test(c[0])) cashOut = moneyNum(c[1]);
    else LIFE.forEach(function(row){
      var m = row[0].test(c[0]) ? row[2].exec(c[1]) : null; if (!m) return;
      var won = +m[1].replace(/,/g, ''), lost = +m[2].replace(/,/g, '');
      if (won + lost > 0) life[row[1]] = [won, won + lost];
    });
  });
  var ft = (doc.querySelector('.foot') || {}).textContent || '';
  var up = /Updated \(page built\) ([0-9:]+ ?ET)/.exec(ft), day = /Trading day ([A-Za-z]{3} \d{1,2} [A-Za-z]{3})/.exec(ft);
  var total = { evals: 0, passed: 0, fundeds: 0, flips: 0 };
  Object.keys(units).forEach(function(k){ var x = units[k]; total.evals += x.evals; total.passed += x.passed; total.fundeds += x.fundeds; total.flips += x.flips.length; });
  return { units: units, sig: sig, total: total, updated: up ? up[1] : '', day: day ? day[1] : '', cash: cashIn !== null && cashOut !== null ? { inn: Math.abs(cashIn), out: Math.abs(cashOut) } : null,
           life: Object.keys(life).length ? life : null };
}
function applyG1(g){
  var seen = [];
  Object.keys(g.units).forEach(function(key){
    var x = g.units[key], f = null;
    state.firms.forEach(function(y){ if (!f && normFirm(y.firm) === x.fkey && sizeNum(y.size) === x.size) f = y; });
    if (!f) f = addRow(state.firms, x.firm, x.size + 'K');
    f.openEvals = x.evals; f.passedNow = x.passed; f.passedDone = x.passedDone; f.fundedNow = x.fundeds; f.inProfitNow = x.flips.length;
    f.g1Flips = x.flips.map(function(z){ return { rem: z.rem === null ? undefined : z.rem, cycle: z.cycle, room: z.room === null ? undefined : z.room, net: z.net === null ? undefined : z.net, done: z.done ? 1 : undefined }; });
    f.g1Evals = x.evalsAt; f.g1Funded = x.fundedsAt;
    f.g1 = true; seen.push(f);
  });
  // a firm or size the dashboard no longer lists: its counts go to zero, and a row that is not in this fleet's set goes away
  state.firms = state.firms.filter(function(f){
    if (seen.indexOf(f) >= 0) return true;
    f.openEvals = 0; f.passedNow = 0; f.passedDone = 0; f.fundedNow = 0; f.inProfitNow = 0; f.g1Flips = []; f.g1Evals = []; f.g1Funded = [];
    return inSet(f);
  });
  logCash(g.cash);
  // a dashboard without its Lifetime table leaves the last counts read in place
  state.g1 = { at: g.updated, day: g.day, sig: g.sig, total: g.total, cash: g.cash, life: g.life ? lifeOf(g.life) : (state.g1 && state.g1.life) || {}, came: cameOf(state.g1 && state.g1.came) };
  save(); syncRates(); update(); drawG1(false);
}
var g1El = document.getElementById('g1');
function drawG1(failed){
  var g = state.g1, has = g && g.total, L = esc(FLEET.label), s = failed ? (has ? L + ' not readable right now, using the last numbers. ' : L + ' not readable right now: account counts are not filled in. ') : '';
  if (has){
    var lack = g.sig ? g.sig.max - g.total.evals : 0;
    s += L + ' ' + esc(g.day || '') + ' ' + esc(g.at || '') + ': ' + g.total.evals + (g.total.evals === 1 ? ' eval' : ' evals') + (g.total.passed ? ' (+' + g.total.passed + ' passed)' : '') + ', ' + g.total.fundeds + ' funded, ' + g.total.flips + ' flipping.';
    if (g.sig) s += ' Max ' + g.sig.max + ' eval signals a day: ' + (lack > 0 ? 'room for ' + lack + ' more.' : 'no room for more evals.');
  } else if (!failed) s += 'Reading ' + L + '…';
  g1El.innerHTML = s + ' <button type="button" id="g1sync">Sync</button>';
  document.getElementById('g1sync').onclick = syncG1;
}
function syncG1(){
  var kept = counted(FLEET.key);
  fetch(G1_URL + '?t=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function(html){
      var g = parseG1(html); if (!g) throw new Error('fleet section not readable');
      applyG1(g);
      // what is kept from the dashboard's builds: the counts when the dashboard has no Lifetime table, and the accounts that came onto it
      kept.then(function(c){ if (!c || !state.g1) return; if (!g.life) state.g1.life = c.life; state.g1.came = c.came; save(); syncRates(); update(); });
    })
    .catch(function(){ drawG1(true); });
}

if (SIM){ buildSim(); syncRates(); update(); syncSim(); setInterval(syncSim, 30 * 60 * 1000); }
else { syncRates(); update(); drawG1(false); syncG1(); setInterval(syncG1, 30 * 60 * 1000); }
// edits made in other browsers: now, whenever this tab is shown again, and every two minutes while it is
pullShared(true);
// A tab left open past midnight would go on planning from the day it was opened on ("Buy today", the weeks, who has traded
// today). Once the date has changed it loads itself again, unless an edit is on its way or a number is being typed.
function newDay(){
  var d = new Date();
  if ((d.getDate() === TODAY.getDate() && d.getMonth() === TODAY.getMonth()) || shareBusy || typing()) return false;
  try { if (window.location && typeof window.location.reload === 'function'){ window.location.reload(); return true; } } catch (e) {}
  return false;
}
setInterval(function(){ if (document.visibilityState !== 'hidden' && !newDay()) pullShared(false); }, 2 * 60 * 1000);
if (document.addEventListener) document.addEventListener('visibilitychange', function(){ if (document.visibilityState !== 'hidden' && !newDay()) pullShared(false); });
})();

</script>
