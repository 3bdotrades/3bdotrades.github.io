<title>Funded Slots Roadmap</title>
<style>
/* One strip of numbers, one table, one chart. Same look as the fleet dashboard this page reads. */
:root{
  color-scheme:dark;
  --bg:#0f1216; --card:#171b21; --row:#1c2128; --ink:#e6e9ed; --mute:#8b949e; --line:#262c35;
  --accent:#6c9cf0; --pos:#4cc27f; --neg:#ef6b5e;
  --in:#199e70; --out:#d95926; --net:#3987e5;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,"Segoe UI",sans-serif}
main{max-width:1180px;margin:0 auto;padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
a:focus-visible,button:focus-visible,input:focus-visible,.chartbox:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mute{color:var(--mute)}
.num{font-variant-numeric:tabular-nums}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{padding:8px 16px;border-bottom:2px solid transparent;color:var(--mute);text-decoration:none}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-color:var(--accent);font-weight:600}
.note{color:var(--mute);font-size:13px;margin:0 0 4px}
.note button{font:inherit;color:var(--accent);background:none;border:0;padding:0;margin-left:6px;cursor:pointer}
.note button:hover{text-decoration:underline}
h2{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:space-between;align-items:baseline;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:22px 0 8px;font-weight:600}
.wrap{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow-x:auto}

/* the strip: four results, four rates */
.top{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:0 14px}
.top>div{display:flex;flex-direction:column;min-width:0}
.top .wrap{flex:1}
.cells{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.cell{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:10px 12px;min-width:0}
.cell+.cell{border-left:1px solid var(--line)}
.cell .k,.cell label{font-size:12px;font-weight:600;color:var(--mute)}
.cell .v{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:6px;font-size:20px;font-weight:600;line-height:1.3;font-variant-numeric:tabular-nums}
.cell .v small{font-size:13px;font-weight:400;color:var(--mute)}
.pct{display:flex;align-items:baseline;gap:4px;color:var(--mute)}
.pct input,.box{width:3.1em;font:600 20px/1.3 system-ui,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0 6px;text-align:right;-moz-appearance:textfield;appearance:textfield}
.pct input::-webkit-outer-spin-button,.pct input::-webkit-inner-spin-button,.box::-webkit-outer-spin-button,.box::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pct input:hover,.box:hover{border-color:var(--mute)}
.box{width:3.6em}
td .box{width:4em;font-size:14px;line-height:1.5}
.box:disabled{opacity:.4}
.seg{display:inline-flex;gap:12px;text-transform:none;letter-spacing:0}
.seg button{font:600 13px/1.2 system-ui,"Segoe UI",sans-serif;color:var(--mute);background:none;border:0;padding:0;cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{color:var(--ink);text-decoration:underline 2px var(--accent);text-underline-offset:5px}

/* per firm */
table{width:100%;border-collapse:collapse}
th,td{padding:8px 12px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;position:sticky;left:0}
thead th{font-size:12px;color:var(--mute);font-weight:600;border-bottom:1px solid var(--line);background:var(--row)}
tbody td:first-child{background:var(--card)}
tbody tr+tr td{border-top:1px solid var(--line)}
tbody tr:hover td{background:var(--row)}
td.who{padding:0}
.pick{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer}
.pick input{flex:none;width:15px;height:15px;margin:0;accent-color:var(--accent);cursor:pointer}
tr.off .pick{color:var(--mute)}
.note.after{margin:8px 2px 0}

/* cash by week */
.legend{display:inline-flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;font-weight:400;text-transform:none;letter-spacing:0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.legend i.line{width:14px;height:2px;border-radius:1px;vertical-align:3px}
.chartcard{padding:12px 12px 6px}
.chartbox{position:relative;min-width:0}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.chartbox text{font-size:11.5px;fill:var(--mute);font-variant-numeric:tabular-nums}
.tip{position:absolute;pointer-events:none;background:var(--row);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.35);min-width:190px;z-index:2}
.tip .h{font-weight:600;margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:16px}
.tip .r span:first-child{color:var(--mute)}
.tip i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}

@media (max-width:1040px){
  .top{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .cells{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cells .cell:nth-child(3){border-left:0}
  .cells .cell:nth-child(n+3){border-top:1px solid var(--line)}
}
</style>

<body>
<main>
  <h1 class="sr">Funded Slots Roadmap</h1>
  <nav class="tabs" aria-label="Fleet"><a class="tab" id="fleet-g1" href="?fleet=g1">G1</a><a class="tab" id="fleet-v2" href="?fleet=v2">V2 fleet</a><a class="tab" id="fleet-sim" href="?fleet=sim">Simulation</a></nav>
  <p class="note" id="g1"></p>

  <div class="top">
    <div>
      <h2 id="sum-h">All firms</h2>
      <div class="wrap cells tiles" id="tiles">
        <div class="cell"><span class="k" id="t-buy-k">Buy today</span><span class="v" id="t-buy">–</span></div>

    </div>

      <h2><span id="rates-h">Rates</span><span class="seg" role="group" aria-label="Rates to use"><button type="button" id="preset-live" aria-pressed="true" title="This fleet's own record: the Lifetime table on the fleet dashboard">Live</button><button type="button" id="preset-plan" aria-pressed="false" title="The backtest plan's rates">Plan</button></span></h2>
      <div class="wrap cells rates">
        <div class="cell" id="c-pass"><label for="r-pass">Eval pass</label><span class="pct"><input id="r-pass" type="number" inputmode="decimal" min="0" max="100" step="any">%</span></div>
        <div class="cell" id="c-win"><label for="r-win">Funded win</label><span class="pct"><input id="r-win" type="number" inputmode="decimal" min="0" max="100" step="any">%</span></div>
        <div class="cell" id="c-flip"><label for="r-flip">Flip 50K</label><span class="pct"><input id="r-flip" type="number" inputmode="decimal" min="0" max="100" step="any">%</span></div>
        <div class="cell" id="c-flip25"><label for="r-flip25">Flip 25K</label><span class="pct"><input id="r-flip25" type="number" inputmode="decimal" min="0" max="100" step="any">%</span></div>
      </div>
    </div>
  </div>

  <h2 id="firms-h">Per firm</h2>
  <div class="wrap" id="firms"></div>
  <p class="note after" id="skip" aria-live="polite" hidden></p>

  <h2><span id="chart-h">Cash by week</span><span class="legend" aria-hidden="true"><span><i style="background:var(--in)"></i>Payouts in</span><span><i style="background:var(--out)"></i>Evals out</span><span><i class="line" style="background:var(--net)"></i>Running total</span></span></h2>
  <div class="wrap chartcard"><div class="chartbox" id="chart" tabindex="0" role="img" aria-label="Weekly cash in and out with the running total. Use the left and right arrow keys to read each week."></div></div>
</main>

<script>
(function(){
'use strict';
// ---------- MODEL START ----------
function num(v, d){ v = Number(v); return isFinite(v) ? v : d; }
function clamp01(v){ v = Number(v); return isFinite(v) ? Math.min(1, Math.max(0, v)) : 0; }
function fundedToProfit(win, tries){ return 1 - Math.pow(1 - clamp01(win), Math.min(10, Math.max(1, Math.round(num(tries, 1))))); }
function params(r){
  var D = Math.min(30, Math.max(1, Math.round(num(r.payDays, 5))));
  return { pass: clamp01(r.pass), win: clamp01(r.win), tries: Math.min(10, Math.max(1, Math.round(num(r.tries, 2)))), q: clamp01(r.flip),
    D: D, D1: Math.min(30, Math.max(1, Math.round(num(r.payDays1, D)))), L: Math.min(60, Math.max(1, Math.round(num(r.lossDays, 20)))),
    E: Math.min(30, Math.max(1, Math.round(num(r.evalDays, 3)))), wd0: Math.max(0, Math.min(5, Math.round(num(r.wd0, 0)))), plan: !!r.plan };
}
// ----- the flip stage -----
// A flip account trades one day at a time. A losing day takes `loss` dollars of its room (the distance to the firm's floor),
// a winning day adds `win`. The fleet's flip is 5 MNQ with a 15-point stop: $150 plus about $7.50 of fees lost; its target is
// 16 points on a 50K ($160 less fees) and 10.75 points on a 25K. Aqua's days are bigger: its two numbers are what its
// accounts showed on the dashboards (losses of $212, $210 and $224, wins of $203).
var DAY_LOSS = 157.5, DAY_LOSS_AT = { 'aqua|50': 215 }, DAY_WIN = 152.5, DAY_WIN_25 = 100, DAY_WIN_AT = { 'aqua|50': 203 };
var FIRM_ALIAS = { bg: 'blueguardian' }, FIRM_KEYS = ['lucid', 'topstep', 'aqua', 'blueguardian', 'futureselite', 'tradeify'];
function dayLoss(firm, size){ return DAY_LOSS_AT[normFirm(firm) + '|' + sizeNum(size)] || DAY_LOSS; }
function dayWin(firm, size){ return DAY_WIN_AT[normFirm(firm) + '|' + sizeNum(size)] || (sizeNum(size) === 25 ? DAY_WIN_25 : DAY_WIN); }
// A payout is a request taken out of the room. About 88% of a request is booked (requests of $1,000 and $1,735.14 booked $870
// and $1,531.63). A request is at least $500, and an account keeps at least one losing day of room.
// (TIE: two amounts closer than this count as equal.)
var KEEP = 0.88, MIN_REQUEST = 500, TIE = 1e-6;
// The flip numbers of one size: its flip win (its own when set, else the rates bar), what a day wins and loses, its room at
// the start, its payouts (as many cycles as it has payouts) and the winning days a payout takes (D1 the first, D the later ones).
// done(k, room): the end of cycle k, with the room the account has once its last winning day is in: what is booked and whether
// the account goes on. The size's usual payout is booked when the room can pay its request and keep one losing day; the account
// then goes on to the next cycle, if the size has one. If the room cannot, what is above one losing day is requested (when that
// is at least the smallest request) and the account stops.
function flipOf(f, P){
  var fq = num(f.flip, 0), s = dayLoss(f.firm, f.size);
  var pays = [Math.max(0, num(f.pay1, 0)), Math.max(0, num(f.pay2, 0)), Math.max(0, num(f.pay3, 0))], last = pays[2] > 0 ? 3 : pays[1] > 0 ? 2 : 1;
  var F = { q: fq > 0 ? clamp01(fq / 100) : P.q, s: s, g: dayWin(f.firm, f.size), room: num(f.room, 0) > 0 ? num(f.room, 0) : P.L * s,
            last: last, D1: P.D1, D: P.D, req: pays.map(function(p){ return p / KEEP; }) };
  F.done = function(k, room){
    if (room - F.req[k - 1] >= s - TIE) return { pay: pays[k - 1], next: k < last };
    var rest = room - s;
    return { pay: rest >= MIN_REQUEST - TIE ? KEEP * rest : 0, next: false };
  };
  return F;
}
// The road of a flip account from a known point: cycle k0 with rem0 winning days still needed and room0 dollars of room.
// From there its state is (cycle, winning days still needed, losing days since). Its room follows from the three, because every
// win adds the same, every loss takes the same and every payout on the way took its usual request. For each state:
// win = the state after a winning day (-1: the account stops), pay = what that day books, loss = the state after a losing day
// (-1: the room is gone and the account is lost). start = the state of the known point; flips = the accounts in each state.
function flipRoad(F, k0, rem0, room0){
  room0 = Math.min(room0, 200 * F.s);
  var W = Math.max(F.D, F.D1), N = Math.floor((room0 + (rem0 + (F.last - k0) * F.D) * F.g) / F.s) + 2, S = 3 * W * N, k, rem, l;
  function at(k, rem, l){ return ((k - 1) * W + (rem - 1)) * N + l; }
  function roomAt(k, rem, l){
    var room = room0 - l * F.s + (k === k0 ? rem0 - rem : rem0 + (k - k0) * F.D - rem) * F.g;
    for (var j = k0; j < k; j++) room -= F.req[j - 1];
    return room;
  }
  var road = { S: S, W: W, N: N, start: at(k0, rem0, 0), win: new Int32Array(S), loss: new Int32Array(S), pay: new Float64Array(S), flips: new Float64Array(S) };
  for (k = 0; k < S; k++){ road.win[k] = -1; road.loss[k] = -1; }
  for (k = k0; k <= F.last; k++) for (rem = 1; rem <= (k === k0 ? rem0 : F.D); rem++) for (l = 0; l < N; l++){
    var room = roomAt(k, rem, l), i = at(k, rem, l);
    if (!(room > TIE)) break;                                  // no room left: no account gets here, nor to any state with more losing days
    if (rem > 1) road.win[i] = at(k, rem - 1, l);
    else { var fin = F.done(k, room + F.g); road.pay[i] = fin.pay; if (fin.next) road.win[i] = at(k + 1, F.D, l); }
    if (l + 1 < N && room - F.s > TIE) road.loss[i] = at(k, rem, l + 1);
  }
  return road;
}
// what an account in each state of a road is still expected to book
function roadValue(road, q){
  var V = new Float64Array(road.S), k, rem, l, i;
  // a win leads to fewer winning days needed or to the next cycle, a loss to one more losing day: those are worked out first
  for (k = 3; k >= 1; k--) for (rem = 1; rem <= road.W; rem++) for (l = road.N - 1; l >= 0; l--){
    i = ((k - 1) * road.W + (rem - 1)) * road.N + l;
    V[i] = q * (road.pay[i] + (road.win[i] >= 0 ? V[road.win[i]] : 0)) + (1 - q) * (road.loss[i] >= 0 ? V[road.loss[i]] : 0);
  }
  return V;
}
// the chance an account in each state of a road has left (stopped after a payout, or lost) within h flip days
function roadExit(road, q, h){
  var cur = new Float64Array(road.S), nx, i;
  for (; h > 0; h--){
    nx = new Float64Array(road.S);
    for (i = 0; i < road.S; i++) nx[i] = q * (road.win[i] < 0 ? 1 : cur[road.win[i]]) + (1 - q) * (road.loss[i] < 0 ? 1 : cur[road.loss[i]]);
    cur = nx;
  }
  return cur;
}
function groupKey(f){ return String(f.firm !== undefined ? f.firm : (f.name || '')).trim().toLowerCase(); }
// The firms run the same trading days side by side, because they share the fleet's eval seats: an eval takes one trade a day
// and the fleet gets only so many eval signals a day, so the evals open across all firms stay within `seats` (no limit when not given).
// Each free seat goes to the firm furthest from full; at a tie, to the one that pays more. Evals a run starts with (f.start,
// bought on its first day) take their seats before any new eval is bought. days, when given, ends the run after that many trading days.
function simulateAll(firms, r, weeks, seats, days){
  var map = {}, groups = [], per = new Array(firms.length);
  firms.forEach(function(f, i){ var k = groupKey(f); if (!(k in map)){ map[k] = groups.length; groups.push([]); } groups[map[k]].push(i); });
  var sims = groups.map(function(idx){ return simulateGroup(idx.map(function(i){ return firms[i]; }), r, weeks, days); });
  var limited = typeof seats === 'number' && isFinite(seats), wants, used;
  // the firm that gets the next seat, among those that can use one
  function next(can){
    var best = -1, gap = 0;
    wants.forEach(function(w, i){
      if (!can(i)) return;
      var g = w.need - used[i] * w.pc;
      if (best < 0 || g > gap + 1e-9 || (g > gap - 1e-9 && w.value > wants[best].value)){ best = i; gap = g; }
    });
    if (best >= 0) used[best]++;
    return best;
  }
  for (var d = 0, nDays = sims.length ? sims[0].nDays : 0; d < nDays; d++){
    wants = sims.map(function(g){ return g.open(d); }); used = wants.map(function(){ return 0; });
    var grant = wants.map(function(w){ return limited ? 0 : w.n; });
    if (!limited) sims.forEach(function(g){ g.start(d, g.waiting()); });
    else {
      var held = 0, i; sims.forEach(function(g){ held += g.held(); });
      var left = Math.max(0, Math.floor(seats - held + 1e-9));
      for (; left > 0 && (i = next(function(k){ return sims[k].waiting() >= 1; })) >= 0; left--) sims[i].start(d, 1);
      for (; left > 0 && (i = next(function(k){ return grant[k] < wants[k].n; })) >= 0; left--) grant[i]++;
    }
    sims.forEach(function(g, k){ g.close(d, grant[k]); });
  }
  groups.forEach(function(idx, gi){ var out = sims[gi].done(); idx.forEach(function(i, j){ per[i] = out[j]; }); });
  return per;
}
// One firm, trading day by trading day. Sizes share the firm's max-trading cap; accounts above it wait idle.
// Evals resolve after E days; a funded account takes one try a day; an account in profit flips one day at a time:
// a winning day brings it closer to its payout (D1 winning days for the first, D for later ones), a losing day takes room,
// and it is lost when the room is gone. Its state is (cycle, winning days still needed, losing days so far): see flipRoad.
// open(d) runs a day up to the evals the firm wants, close(d, n) buys n of them and books the day. A size marked skip gets no new evals.
function simulateGroup(units, r, weeks, days){
  var P = params(r), c = fundedToProfit(P.win, P.tries), pc = P.pass * c, H = P.E;
  var nDays = Math.max(1, days > 0 ? Math.min(Math.round(days), weeks * 5 - P.wd0) : weeks * 5 - P.wd0), LD = nDays + P.E + P.tries + 8, capSum = 0;
  function zeros(){ var a = new Array(LD); for (var k = 0; k < LD; k++) a[k] = 0; return a; }
  // The road of a size's accounts from one known point, made once. With it: the chance an account in each state leaves
  // (stops after a payout, or is lost) within H flip days: an eval bought today needs its slot E trading days from now.
  function roadOf(u, k0, rem0, room0){
    var key = k0 + '|' + rem0 + '|' + room0, road = u.byKey[key];
    if (!road){ road = u.byKey[key] = flipRoad(u.F, k0, rem0, room0); road.exit = roadExit(road, u.q, H); u.roads.push(road); }
    return road;
  }
  var U = units.map(function(f){
    var w = perWinning(f, r), F = flipOf(f, P);
    var u = { slots: Math.max(0, Math.floor(num(f.slots, 0))), F: F, q: F.q,
      price: Math.max(0, num(f.evalPrice, 0)), actFee: Math.max(0, num(f.activation, 0)), monthly: Math.max(0, num(f.monthly, 0)), value: w ? w.net : 0, skip: !!f.skip,
      evalRes: zeros(), profitAt: zeros(), failAt: zeros(), roads: [], byKey: {}, fc: 0, waitFunded: 0, wait: 0, pending: 0, trying: 0, days: [] };
    // an account that has just reached profit starts its first cycle with the size's full room
    u.fresh = roadOf(u, 1, P.D1, F.room);
    // evals the run starts with: paid for on its first day, trading once they have a seat
    u.queue = u.start0 = Math.max(0, Math.round(num(f.start, 0)));
    capSum += u.slots;
    return u;
  });
  var cap = units[0].firmCap !== undefined ? Math.max(0, Math.floor(num(units[0].firmCap, 0))) : capSum;
  var order = U.map(function(u, j){ return j; }).sort(function(a, b){ return (U[b].value - U[a].value) || (a - b); });
  function sumF(u){ var s = 0; u.roads.forEach(function(road){ for (var i = 0, a = road.flips; i < road.S; i++) s += a[i]; }); return s; }
  function soonExits(u){ var s = 0; u.roads.forEach(function(road){ for (var i = 0, a = road.flips; i < road.S; i++) if (a[i] > 0) s += a[i] * road.exit[i]; }); return s; }
  function trading(){ var s = 0; U.forEach(function(u){ s += u.trying + u.fc; }); return s; }
  // one flip day for every account of a size: the cash booked that day
  function flipStep(u){
    var cash = 0;
    u.roads.forEach(function(road){
      var cur = road.flips, nx = new Float64Array(road.S);
      for (var i = 0; i < road.S; i++){

function money(v){ var s = Math.round(Math.abs(v)).toLocaleString('en-US'); return (v < -0.5 ? '−$' : '$') + s; }

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

// ---------- chart ----------
var chartEl = document.getElementById('chart');

function niceStep(range, n){ var raw = range / Math.max(1, n), mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag; }

  var h = Math.abs(yb - yt); if (h < 0.5) return '';

  return 'M' + x0 + ',' + yb + 'L' + x0 + ',' + (yt - r) + 'Q' + x0 + ',' + yt + ' ' + (x0 + r) + ',' + yt + 'L' + (x1 - r) + ',' + yt + 'Q' + x1 + ',' + yt + ' ' + x1 + ',' + (yt - r) + 'L' + x1 + ',' + yb + 'Z';
}
function drawChart(rows){
  lastRows = rows;
  var W = Math.max(280, Math.floor(chartEl.clientWidth || 600)), narrow = W < 560;
  var H = narrow ? 220 : 250, m = { l: narrow ? 44 : 54, r: narrow ? 14 : 70, t: 14, b: 40 };
  var iw = W - m.l - m.r, ih = H - m.t - m.b, n = rows.length;
  var hi = 1, lo = 0;
  rows.forEach(function(r){ hi = Math.max(hi, r.inn, r.cum); lo = Math.min(lo, -r.out, r.cum); });
  var step = niceStep(hi - lo, narrow ? 4 : 5);
  var y0 = Math.floor(lo / step) * step, y1 = Math.ceil(hi / step) * step; if (y1 === y0) y1 = y0 + step;
  function y(v){ return m.t + ih - (v - y0) / (y1 - y0) * ih; }

  var bw = Math.max(5, Math.min(24, band * 0.46));

  var past = 0; rows.forEach(function(r){ if (r.actual) past++; });
  if (past){ s += '<rect x="' + m.l + '" y="' + m.t + '" width="' + (band * past).toFixed(1) + '" height="' + ih + '" fill="var(--row)"/>' +
    '<text x="' + (m.l + 6) + '" y="' + (m.t + 12) + '" style="fill:var(--ink);font-weight:600">Actual</text>' +
    '<text x="' + (m.l + band * past + 6) + '" y="' + (m.t + 12) + '" style="fill:var(--ink);font-weight:600">Plan</text>'; }
  for (var v = y0; v <= y1 + step / 2; v += step){
    var yy = Math.round(y(v)) + 0.5;

    s += '<text x="' + (m.l - 8) + '" y="' + (yy + 4) + '" text-anchor="end">' + kmoney(v) + '</text>';

  var zy = y(0);

      s += '<text x="' + cx + '" y="' + (H - m.b + 30) + '" text-anchor="middle">' + dShort(weekStart(r.t)) + '</text>';
    }

  var d = rows.map(function(r, i){ return (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(r.cum).toFixed(1); }).join('');
  s += '<path d="' + d + '" fill="none" stroke="var(--net)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  rows.forEach(function(r, i){ s += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(r.cum).toFixed(1) + '" r="' + (i === n - 1 ? 5 : 3.5) + '" fill="var(--net)" stroke="var(--card)" stroke-width="2"/>'; });
  var last = rows[n - 1];
  if (!narrow) s += '<text x="' + (x(n - 1) + 10) + '" y="' + (y(last.cum) + 4) + '" style="fill:var(--ink);font-weight:600">' + signed(last.cum) + '</text>';
  s += '<line id="xhair" x1="0" x2="0" y1="' + m.t + '" y2="' + (m.t + ih) + '" stroke="var(--mute)" stroke-width="1" visibility="hidden"/>';
  s += '</svg>';
  chartEl.innerHTML = s;
  chartEl.appendChild(tipEl);
  geom = { x: x, band: band, m: m, W: W, n: n, ih: ih };
  if (focusIdx >= 0) showTip(Math.min(focusIdx, n - 1));
}
function showTip(i){
  if (!geom || !lastRows[i]) return;

  tipEl.innerHTML = '<div class="h">W' + r.t + ' · from ' + dShort(weekStart(r.t)) + (r.actual ? ' · actual' : '') + '</div>' +
    '<div class="r"><span><i style="background:var(--in)"></i>Payouts in</span><span class="num">' + money(r.inn) + '</span></div>' +
    '<div class="r"><span><i style="background:var(--out)"></i>' + (r.actual ? 'Fees paid' : 'Evals out') + '</span><span class="num">' + money(r.out) + '</span></div>' +
    '<div class="r"><span><i style="background:var(--net)"></i>Running total</span><span class="num">' + signed(r.cum) + '</span></div>' +
    (r.actual ? '' : '<div class="r"><span>Evals to buy</span><span class="num">' + r.buy + '</span></div>') +
    (r.items && r.items.length ? '<div class="r"><span>' + r.items.map(function(e){ return esc(itemText(e)); }).join('<br>') + '</span></div>' : '');

function hideTip(){ tipEl.hidden = true; var xh = chartEl.querySelector('#xhair'); if (xh) xh.setAttribute('visibility', 'hidden'); }
chartEl.addEventListener('pointermove', function(e){

function outcome(rr, all){

  return res;

// what skipping does to the four totals, against buying at every firm
function effect(res, all){
  var dBuy = res.buy - all.buy, dCost = res.cost - all.cost, dNeed = res.need - all.need, dNet = res.net - all.net, dRun = res.run - all.run, p = [];
  function amt(v, less, more){ return money(Math.abs(v)) + ' ' + (v < 0 ? less : more); }
  function tone(v, s){ return '<span class="' + (v > 0 ? 'pos' : 'neg') + '">' + s + '</span>'; }
  if (dBuy !== 0) p.push(Math.abs(dBuy) + (dBuy < 0 ? ' fewer' : ' more') + (Math.abs(dBuy) === 1 ? ' eval ' : ' evals ') + BUY_DAY + ' (' + amt(dCost, 'saved', 'more') + ')');
  else if (Math.abs(dCost) > 0.5) p.push('the evals ' + BUY_DAY + ' cost ' + amt(dCost, 'less', 'more'));

        '<span>' + esc(f.firm) + ' ' + quiet(esc(f.size)) + '</span></label></td>' +

        '<td id="s' + i + '-cost"></td><td id="s' + i + '-in"></td><td id="s' + i + '-net"></td></tr>';
    }).join('') + '</tbody></table>';
}
function updateSim(){
  // calendar days to trading days; the weeks drawn are the ones those days reach into
  var rr = fracRates(state.rates), pn = presetName(state.rates), cap = seats(), T = Math.max(1, Math.round(state.days * 5 / 7)), W = Math.ceil((WD0 + T) / 5), tot = 0;
  simFirms = simRows();
  var res = runAll(simFirms.map(function(f){ return boxed(clone(f), rr); }), rr, W, cap, T);
  document.getElementById('preset-live').setAttribute('aria-pressed', pn === 'live');
  document.getElementById('preset-plan').setAttribute('aria-pressed', pn === 'plan');
  simFirms.forEach(function(f, i){
    var inn = 0, out = 0; res.per[i].rows.forEach(function(x){ inn += x.inn; out += x.out; });
    tot += f.start;
    document.getElementById('s' + i + '-cost').innerHTML = out > 0.5 ? money(out) : quiet('$0');
    document.getElementById('s' + i + '-in').innerHTML = inn > 0.5 ? money(inn) : quiet('$0');
    document.getElementById('s' + i + '-net').innerHTML = gain(inn - out);
  });
  var total = document.getElementById('s-total'); if (document.activeElement !== total) total.value = tot;
  document.getElementById('s-cost').textContent = tot > 0 ? money(res.totOut) : '';
  document.getElementById('s-in').textContent = money(res.totIn);
  document.getElementById('s-net-k').textContent = 'Net after ' + state.days + ' days';
  var net = document.getElementById('s-net'); net.textContent = signed(res.net); net.className = 'v ' + (res.net >= 0 ? 'pos' : 'neg');
  // whose rates and signals, and what the signals mean for this many evals
  g1El.innerHTML = 'Rates and signals of <span class="seg" role="group" aria-label="Fleet">' + ['g1', 'v2'].map(function(k){ return '<button type="button" id="base-' + k + '" aria-pressed="' + (state.base === k) + '">' + esc(FLEETS[k].label) + '</button>'; }).join('') + '</span>' +
    (cap ? ': max ' + cap + ' eval signals a day' + (tot > cap ? ', so ' + cap + ' of the ' + tot + ' evals trade at once and the rest wait for a seat.' : '.')
         : simDown ? ': the dashboard is not readable right now, so every eval trades from day one.' : ': reading the dashboard…');
  ['g1', 'v2'].forEach(function(k){
    document.getElementById('base-' + k).onclick = function(){
      if (state.base === k) return;
      state.base = k; if (state.follow) state.rates = liveRates();
      save(); syncRates(); buildSim(); update();
    };
  });
  drawChart(res.rows);
}
if (SIM){
  firmsEl.addEventListener('input', function(e){
    var i = e.target && e.target.getAttribute ? e.target.getAttribute('data-n') : null; if (i === null || !simFirms[i]) return;
    state.evals[unitKey(simFirms[i])] = Math.min(500, Math.max(0, Math.round(num(e.target.value, 0))));
    save(); update();
  });
  tilesEl.addEventListener('input', function(e){
    var el = e.target || {}, v = Math.round(num(el.value, 0));
    if (el.id === 's-days') state.days = v > 0 ? Math.min(364, Math.max(5, v)) : 84;
    else if (el.id === 's-total'){
      // a typed total is split evenly over the ticked firms
      var on = simFirms.filter(function(f){ return state.off.indexOf(unitKey(f)) < 0; }), n = Math.min(500 * on.length, Math.max(0, v));
      on.forEach(function(f, j){ state.evals[unitKey(f)] = Math.floor(n / on.length) + (j < n % on.length ? 1 : 0); });
      simFirms.forEach(function(f, i){ document.getElementById('s' + i + '-n').value = simEvals(unitKey(f)); });
      if (n !== v) el.value = n;
    }
    else return;
    save(); update();
  });
}
// the eval signals and the Lifetime counts of both fleets, from the dashboard
function syncSim(){
  var kept = { g1: counted('g1'), v2: counted('v2') };
  fetch(G1_URL + '?t=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function(html){
      var any = false;
      ['g1', 'v2'].forEach(function(k){
        var g = parseG1(html, k); if (!g) return;
        if (g.sig && g.sig.max > 0){ state.sig[k] = g.sig.max; any = true; }
        if (g.life) state.life[k] = g.life;
        else kept[k].then(function(c){ if (!c) return; state.life[k] = c; if (state.follow) state.rates = liveRates(); save(); syncRates(); update(); });
      });
      if (!any) throw new Error('signals not readable');
      simDown = false;
      if (state.follow) state.rates = liveRates();
      save(); syncRates(); update();
    })
    .catch(function(){ simDown = true; update(); });
}

// ---------- dashboard sync: read this fleet's section of the fleet dashboard and fill the accounts ----------
var G1_URL = 'https://randompotato247.github.io/fleet-dashboard/';
// The Lifetime counts for when the dashboard carries no Lifetime table: tools/track.js keeps them on this site's "track"
// branch, counted on from the last table the dashboard showed, build by build. null when they cannot be read.
var COUNTS_URL = 'https://raw.githubusercontent.com/3bdotrades/3bdotrades.github.io/track/';
function counted(k){
  return fetch(COUNTS_URL + k + '.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(j){ var o = j && j.v === 2 ? lifeOf(j.counts) : {}; return RATE_KEYS.every(function(x){ return o[x]; }) ? o : null; })
    .catch(function(){ return null; });
}
function lev(a, b){
  var p = [], i, j; for (j = 0; j <= b.length; j++) p[j] = j;
  for (i = 1; i <= a.length; i++){ var q = [i]; for (j = 1; j <= b.length; j++) q[j] = Math.min(p[j] + 1, q[j - 1] + 1, p[j - 1] + (a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1)); p = q; }
  return p[b.length];
}
// a firm name as a key; a near-miss spelling of one of the fleet's firms ("Blue Gurdian", "Tradify") gets that firm's key
function normFirm(s){
  s = String(s || '').toLowerCase().replace(/\b(xfa|funded|flex)\b/g, '').replace(/[^a-z]/g, ''); s = FIRM_ALIAS[s] || s;
  if (FIRM_KEYS.indexOf(s) >= 0) return s;
  for (var i = 0; i < FIRM_KEYS.length; i++){ var k = FIRM_KEYS[i]; if (lev(s, k) <= (k.length >= 10 ? 2 : k.length >= 5 ? 1 : 0)) return k; }
  return s;
}
function sizeNum(s){ var m = /(\d+)/.exec(String(s || '')); return m ? +m[1] : 50; }
function moneyNum(s){ var m = /(-?)\$([\d,]+)/.exec(String(s || '')); return m ? (m[1] ? -1 : 1) * Number(m[2].replace(/,/g, '')) : null; }
function g1Size(id, total, isEval){
  var m = /^LF[EF]0?(25|50|100|150)/i.exec(id) || /DFYSLX?(25|50|100|150)/i.exec(id);
  if (m) return +m[1];
  if (isEval){ var t = /of \$([\d,]+)/.exec(total); if (t){ var v = +t[1].replace(/,/g, ''); return v <= 1600 ? 25 : v <= 3500 ? 50 : v <= 6500 ? 100 : 150; } }
  return 50;
}
function parseG1(html, K){
  var doc = new DOMParser().parseFromString(html, 'text/html');
  K = K || FLEET.key;
  var sec = doc.getElementById('eng-' + K); if (!sec) return null;
  var units = {};
  function unit(firmText, size){
    var fk = normFirm(firmText), key = fk + '|' + size;
    if (!units[key]) units[key] = { fkey: fk, firm: firmText.replace(/\s+(XFA|funded|Flex)$/i, ''), size: size, evals: 0, passed: 0, fundeds: 0, flips: [] };
    return units[key];
  }
  function cells(tr){ return Array.prototype.map.call(tr.children, function(c){ return c.textContent.replace(/\s+/g, ' ').trim(); }); }
  function allRows(id){ var pane = sec.querySelector('#' + id); return pane ? Array.prototype.slice.call(pane.querySelectorAll('tr')).map(cells).filter(function(c){ return c.length >= 5 && c[0] !== 'Account'; }) : null; }
  function rows(id){ return (allRows(id) || []).filter(function(c){ return !/LIQUIDATED|RETIRED/i.test(c[3]); }); }
  // a dashboard whose layout changed must not read as "no accounts": the tab counts and the tables have to agree
  var raw = ['eval', 'funded', 'flip'].map(function(n){ var a = allRows('p-' + K + '-' + n); return a ? a.length : -1; });
  var secText = sec.textContent.replace(/\s+/g, ' '), tabs = /Evals ?(\d+) ?Fundeds ?(\d+) ?Flips ?(\d+)/.exec(secText), act = /Active accounts \((\d+)\)/.exec(secText);
  if (tabs){ for (var t = 0; t < 3; t++) if (+tabs[t + 1] > 0 && raw[t] <= 0) return null; }
  else if (Math.max(raw[0], raw[1], raw[2]) < 0 || (act && +act[1] > 0 && Math.max(0, raw[0]) + Math.max(0, raw[1]) + Math.max(0, raw[2]) === 0)) return null;
  rows('p-' + K + '-eval').forEach(function(c){ var u = unit(c[1], g1Size(c[0], c[3], true)); if (/PASSED/i.test(c[3])) u.passed++; else u.evals++; });
  rows('p-' + K + '-funded').forEach(function(c){ unit(c[1], g1Size(c[0], c[3], false)).fundeds++; });
  // G1 shows "n/4 days" before the first payout and "n/5 days" after one
  rows('p-' + K + '-flip').forEach(function(c){
    var m = /(\d+)\s*\/\s*(\d+)\s*days/i.exec(c[3]), room = moneyNum(c[4]), u = unit(c[1], g1Size(c[0], c[3], false));
    u.flips.push({ rem: m ? +m[2] - +m[1] : null, cycle: m && +m[2] > 4 ? 2 : 1, room: room !== null && room > 0 ? room : null });
  });
  // eval signals: the "Avg signals" row of the summary table that has an Evals column
  var sig = null;
  Array.prototype.forEach.call(sec.querySelectorAll('table.sum'), function(sum){
    var heads = Array.prototype.map.call(sum.querySelectorAll('thead th'), function(th){ return th.textContent.trim().toLowerCase(); }), ei = heads.indexOf('evals');
    Array.prototype.forEach.call(sum.querySelectorAll('tbody tr'), function(tr){
      var c = cells(tr); if (ei > 0 && /^avg signals/i.test(c[0] || '')){ var m = /([\d.]+)[^\d]*max\s*(\d+)/i.exec(c[ei] || ''); if (m) sig = { avg: +m[1], max: +m[2] }; }
    });
  });
  // cash totals of this fleet: the two-cell "Received" and "Spent" rows.
  // Its Lifetime table: the two-cell rows "Evals", "Funded first win", "Flip days 50K" and "Flip days 25K", kept as [won, finished]
  // (running and retired accounts are in neither number)
  var cashIn = null, cashOut = null, life = {}, WL = /([\d,]+) won\D+?([\d,]+) lost/i;
  var LIFE = [[/^evals$/i, 'pass', /([\d,]+) passed\D+?([\d,]+) blown/i], [/^funded first win$/i, 'win', WL], [/^flip days 50k$/i, 'flip', WL], [/^flip days 25k$/i, 'flip25', WL]];
  Array.prototype.forEach.call(sec.querySelectorAll('tr'), function(tr){
    var c = cells(tr); if (c.length !== 2) return;
    if (/^received$/i.test(c[0])) cashIn = moneyNum(c[1]);
    else if (/^spent$/i.test(c[0])) cashOut = moneyNum(c[1]);
    else LIFE.forEach(function(row){
      var m = row[0].test(c[0]) ? row[2].exec(c[1]) : null; if (!m) return;
      var won = +m[1].replace(/,/g, ''), lost = +m[2].replace(/,/g, '');
      if (won + lost > 0) life[row[1]] = [won, won + lost];
    });
  });
  var ft = (doc.querySelector('.foot') || {}).textContent || '';
  var up = /Updated \(page built\) ([0-9:]+ ?ET)/.exec(ft), day = /Trading day ([A-Za-z]{3} \d{1,2} [A-Za-z]{3})/.exec(ft);
  var total = { evals: 0, passed: 0, fundeds: 0, flips: 0 };
  Object.keys(units).forEach(function(k){ var x = units[k]; total.evals += x.evals; total.passed += x.passed; total.fundeds += x.fundeds; total.flips += x.flips.length; });
  return { units: units, sig: sig, total: total, updated: up ? up[1] : '', day: day ? day[1] : '', cash: cashIn !== null && cashOut !== null ? { inn: Math.abs(cashIn), out: Math.abs(cashOut) } : null,
           life: Object.keys(life).length ? life : null };
}
function applyG1(g){
  var seen = [];
  Object.keys(g.units).forEach(function(key){
    var x = g.units[key], f = null;
    state.firms.forEach(function(y){ if (!f && normFirm(y.firm) === x.fkey && sizeNum(y.size) === x.size) f = y; });
    if (!f) f = addRow(state.firms, x.firm, x.size + 'K');
    f.openEvals = x.evals; f.passedNow = x.passed; f.fundedNow = x.fundeds; f.inProfitNow = x.flips.length;
    f.g1Flips = x.flips.map(function(z){ return { rem: z.rem === null ? undefined : z.rem, cycle: z.cycle, room: z.room === null ? undefined : z.room }; });
    f.g1 = true; seen.push(f);
  });
  // a firm or size the dashboard no longer lists: its counts go to zero, and a row that is not in this fleet's set goes away
  state.firms = state.firms.filter(function(f){
    if (seen.indexOf(f) >= 0) return true;
    f.openEvals = 0; f.passedNow = 0; f.fundedNow = 0; f.inProfitNow = 0; f.g1Flips = [];
    return inSet(f);
  });
  logCash(g.cash);
  // a dashboard without its Lifetime table leaves the last counts read in place
  state.g1 = { at: g.updated, day: g.day, sig: g.sig, total: g.total, cash: g.cash, life: g.life ? lifeOf(g.life) : (state.g1 && state.g1.life) || {} };
  if (state.follow) state.rates = liveRates();
  save(); syncRates(); update(); drawG1(false);
}
var g1El = document.getElementById('g1');
function drawG1(failed){
  var g = state.g1, has = g && g.total, L = esc(FLEET.label), s = failed ? (has ? L + ' not readable right now, using the last numbers. ' : L + ' not readable right now: account counts are not filled in. ') : '';
  if (has){
    var lack = g.sig ? g.sig.max - g.total.evals : 0;
    s += L + ' ' + esc(g.day || '') + ' ' + esc(g.at || '') + ': ' + g.total.evals + (g.total.evals === 1 ? ' eval' : ' evals') + (g.total.passed ? ' (+' + g.total.passed + ' passed)' : '') + ', ' + g.total.fundeds + ' funded, ' + g.total.flips + ' flipping.';
    if (g.sig) s += ' Max ' + g.sig.max + ' eval signals a day: ' + (lack > 0 ? 'room for ' + lack + ' more.' : 'no room for more evals.');
  } else if (!failed) s += 'Reading ' + L + '…';
  g1El.innerHTML = s + ' <button type="button" id="g1sync">Sync</button>';
  document.getElementById('g1sync').onclick = syncG1;
}
function syncG1(){
  var kept = counted(FLEET.key);
  fetch(G1_URL + '?t=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function(html){
      var g = parseG1(html); if (!g) throw new Error('fleet section not readable');
      applyG1(g);
      // no Lifetime table on the dashboard: the counts kept from its builds
      if (!g.life) kept.then(function(c){ if (!c || !state.g1) return; state.g1.life = c; if (state.follow) state.rates = liveRates(); save(); syncRates(); update(); });
    })
    .catch(function(){ drawG1(true); });
}

if (SIM){ buildSim(); syncRates(); update(); syncSim(); setInterval(syncSim, 30 * 60 * 1000); }
else { syncRates(); update(); drawG1(false); syncG1(); setInterval(syncG1, 30 * 60 * 1000); }
})();

</script>
